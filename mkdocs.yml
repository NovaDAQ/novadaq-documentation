site_name: NOvA DAQ Documentation
site_description: Package reference, operations, dependencies, and review priorities
repo_url: https://github.com/NovaDAQ/novadaq-documentation
use_directory_urls: false
theme:
  name: material
  font: false
  features:
    - navigation.tabs
    - navigation.top
    - content.code.copy
plugins:
  - search
markdown_extensions:
  - tables
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
extra_javascript:
  - assets/explorer.js
extra_css:
  - assets/style.css
validation:
  nav:
    omitted_files: info
  links:
    not_found: warn
    unrecognized_links: warn
nav:
  - Home: index.md
  - Review:
      - Priorities: review/index.md
      - Coverage: review/coverage.md
      - Methodology: review/methodology.md
      - Validation: review/validation.md
      - Snapshot: review/snapshot.md
  - Architecture:
      - System: architecture/index.md
      - Dependencies: architecture/dependencies.md
      - Explorer: architecture/explorer.md
  - Operations:
      - Runbook: operations/index.md
      - Build and release: operations/build.md
      - Recovery: operations/recovery.md
  - Packages:
